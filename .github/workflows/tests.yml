name: Shader tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Install shader compiler and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate shader programs
        run: python tools/validate_shaders.py
      - name: Run helper tests
        run: pytest -q
